# Prévia pública gratuita no GitHub Pages: https://dxpprodutosdigitais.github.io/Countryclube/
# (site na raiz, painel em /Countryclube/admin/). Roda a cada push neste branch ou manualmente.
# Se o primeiro run falhar em "configure-pages", ative uma vez em Settings → Pages → Source: "GitHub Actions".
name: Pages (prévia)

on:
  push:
    branches: [main, claude/country-club-website-9d61al]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build:pages
      # O token do workflow não consegue CRIAR o site do Pages; isso é feito uma vez em
      # Settings → Pages → Source: GitHub Actions. Até lá, este passo avisa e o deploy é pulado,
      # sem marcar o PR como falho.
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - if: steps.pages.outcome != 'success'
        run: echo "::warning title=Pages não ativado::Ative em Settings → Pages → Source 'GitHub Actions' e rode o workflow de novo."
      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with: { path: out }
    outputs:
      pronto: ${{ steps.pages.outcome }}

  deploy:
    needs: build
    if: needs.build.outputs.pronto == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
