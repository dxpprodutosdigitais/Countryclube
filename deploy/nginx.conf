# Nginx: copie para /etc/nginx/sites-available/countryclube e ative com um link em sites-enabled.
# Emita o certificado com: certbot --nginx -d countryclube.dxp.dev.br
server {
    listen 80;
    listen [::]:80;
    server_name countryclube.dxp.dev.br;

    root /var/www/countryclube;   # conteúdo de `out/` (npm run build:static)
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml text/plain application/xml;

    location /_next/static/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location /images/       { add_header Cache-Control "public, max-age=604800"; }

    # /agenda → /agenda/ → /agenda/index.html (rotas do export com trailingSlash)
    location / {
        try_files $uri $uri/index.html $uri.html /404.html;
    }
    error_page 404 /404.html;
}
