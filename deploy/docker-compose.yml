# docker compose -f deploy/docker-compose.yml up -d   → Caddy publica o site em https://countryclube.dxp.dev.br
services:
  site:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    expose: ["3000"]
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    command: caddy reverse-proxy --from countryclube.dxp.dev.br --to site:3000
volumes:
  caddy_data:
  caddy_config:
